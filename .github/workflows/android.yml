name: Android APK
on:
  push:
    branches: [claude/project-thread-wgvak6, claude/project-thread-lpe30e]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ombor-pechat-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Commit APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/ombor-pechat.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/ombor-pechat.apk
          git commit -m "APK yig'ildi [skip ci]" || exit 0
          git push
