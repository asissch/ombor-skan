name: Android APK
on:
  push:
    branches: ['main', 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ombor-pechat-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Commit APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/ombor-pechat.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk/ombor-pechat.apk
          git commit -m "APK yig'ildi [skip ci]" || exit 0
          git push
      - name: Publish update (GitHub release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          NAME=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          TAG="v${NAME}-${CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 0; fi
          cp apk/ombor-pechat.apk /tmp/ombor-pechat.apk
          python3 - "$CODE" "$NAME" > /tmp/version.json <<'PY'
          import json, sys, os
          izoh = open("android/YANGILIK.txt", encoding="utf-8").read().strip() if os.path.exists("android/YANGILIK.txt") else ""
          print(json.dumps({"versionCode": int(sys.argv[1]), "versionName": sys.argv[2],
                            "apk": "https://github.com/${{ github.repository }}/releases/latest/download/ombor-pechat.apk",
                            "izoh": izoh}, ensure_ascii=False))
          PY
          cat /tmp/version.json
          gh release create "$TAG" /tmp/ombor-pechat.apk /tmp/version.json --title "Ombor Pechat $NAME" --notes-file android/YANGILIK.txt --latest --target "$GITHUB_SHA"
