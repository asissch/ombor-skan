plugins { id 'com.android.application' }

android {
    namespace 'uz.ombor.pechat'
    compileSdk 34
    defaultConfig {
        applicationId 'uz.ombor.pechat'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        ombor {
            storeFile file('../ombor-pechat.jks')
            storePassword 'ombor-pechat'
            keyAlias 'ombor'
            keyPassword 'ombor-pechat'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ombor
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
